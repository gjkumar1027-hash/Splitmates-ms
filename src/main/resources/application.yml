spring:
  application:
    name: splitmates-api
  config:
    # Local secrets (DB URL, JWT secret...) live in backend/.env, which is git-ignored.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/splitmates}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 100
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  public-url: ${PUBLIC_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  otp:
    # In dev mode the OTP is logged and returned in the API response (no SMS gateway needed).
    dev-mode: ${OTP_DEV_MODE:true}
    ttl-minutes: 5
    max-per-hour: 5
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
